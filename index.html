<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>KinoRoom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #292116 0%, #0b0b0b 35%, #030303 75%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 45px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 105px;
      height: 105px;
      border: 1px solid rgba(214, 173, 85, 0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 35px rgba(214, 173, 85, 0.10);
    }
    .logo span {
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: bold;
      color: #d6ad55;
      letter-spacing: -4px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
      color: #d6ad55;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }
    .subtitle {
      color: #999;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .button {
      width: 100%;
      min-height: 62px;
      border: 1px solid rgba(214, 173, 85, 0.35);
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.055),
        rgba(255,255,255,0.018)
      );
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 0 20px;
      transition: 0.25s ease;
    }
    .button:active {
      transform: scale(0.98);
    }
    .icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      border: 1px solid rgba(214, 173, 85, 0.35);
      color: #d6ad55;
      font-size: 18px;
      flex-shrink: 0;
    }
    .button-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .button-title {
      font-size: 15px;
      font-weight: 600;
    }
    .button-subtitle {
      color: #888;
      font-size: 12px;
    }
    .arrow {
      margin-left: auto;
      color: #d6ad55;
      font-size: 22px;
    }
    .divider {
      width: 70px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #d6ad55,
        transparent
      );
      margin: 28px 0 20px;
    }
    .footer {
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">
      <span>KR</span>
    </div>
    <h1>KinoRoom</h1>
    <div class="subtitle">
      Film · Series · More
    </div>
    <div class="buttons">
      <a
        class="button"
        href="https://instagram.com/kinoroom_st"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="icon">◎</div>
        <div class="button-text">
          <div class="button-title">Instagram</div>
          <div class="button-subtitle">@kinoroom_st</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a
        class="button"
        href="https://t.me/Kinoroom_st"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="icon">➤</div>
        <div class="button-text">
          <div class="button-title">Telegram</div>
          <div class="button-subtitle">@Kinoroom_st</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a
        class="button"
        href="tel:+998988009609"
      >
        <div class="icon">☎</div>
        <div class="button-text">
          <div class="button-title">Позвонить</div>
          <div class="button-subtitle">+998 98 800 96 09</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a
        class="button"
        href="tel:+998902525522"
      >
        <div class="icon">☎</div>
        <div class="button-text">
          <div class="button-title">Позвонить</div>
          <div class="button-subtitle">+998 90 252 55 22</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>
    <div class="divider"></div>
    <div class="footer">
      KINOROOM
    </div>
  </main>
</body>
</html>
